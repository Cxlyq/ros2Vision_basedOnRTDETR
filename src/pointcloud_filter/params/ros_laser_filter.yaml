laser_filter:
  ros__parameters:
    use_sim_time: true

    filter1:
      name: speckle_filter # 孤立噪点滤波器
      type: laser_filters/LaserScanSpeckleFilter
      params:
        filter_type: 0
        max_range: 2.0
        max_range_difference: 0.1
        filter_window: 2
    filter2:
      name: range_filter   # 距离滤波器
      type: laser_filters/LaserScanRangeFilter
      params:
        use_message_range_limits: false
        lower_threshold: 0.45  # 剔除极近处的扫地噪点和车身反光
        upper_threshold: 12.0  # 忽略 12 米以上的远距离噪点
        lower_replacement_value: .inf # 被过滤掉的近点变为无穷远(空闲)
        upper_replacement_value: .inf # 被过滤掉的远点变为无穷远(空闲)